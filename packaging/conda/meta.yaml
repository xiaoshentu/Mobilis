{% set version = load_file_regex(load_file="mobility_tool/__init__.py", regex_pattern='__version__ = "([^"]+)"',
                                 from_recipe_dir=False).group(1) %}

package:
  name: mobilis
  version: {{ version }}

source:
  path: ../..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - mobilis = mobility_tool.cli:main
    - mobilis-gui = mobility_tool.gui:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61
  run:
    - python >=3.9
    - numpy >=1.20
    - scipy >=1.7
    - matplotlib-base >=3.5
    - scikit-image >=0.19
    - tk
  run_constrained:
    - numba >=0.57

test:
  imports:
    - mobility_tool
    - mobility_tool.tvcf
    - mobility_tool.dp
  commands:
    - mobilis --version
    - mobilis tvcf -h

about:
  home: https://github.com/xiaoshentu/Mobilis
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Charge-transport and photophysics toolkit for organic semiconductors
